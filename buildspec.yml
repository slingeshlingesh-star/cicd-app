version: 0.2

phases:
  pre_build:
    commands:
       - echo Logging / auth in to Amazon ECR
       -aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 573371913821.dkr.ecr.eu-north-1.amazonaws.com
  build:
    commands:
      - echo Build started
      - echo Building the docker image
      - docker build -t cicd-pipeline3-image . 
      - docker tag cicd-pipeline3-image:latest 573371913821.dkr.ecr.eu-north-1.amazonaws.com/cicd-pipeline3-image:latest


  post_build:
    commands:
     - echo build completed
     - echo pushing in to docker ECR...
     - docker push 573371913821.dkr.ecr.eu-north-1.amazonaws.com/cicd-pipeline3-image:latest
     - echo Writing image definition file..
     - printf '[{"name":"%s","imageUri":"%s"}]' "cicp-pipe" "573371913821.dkr.ecr.eu-north-1.amazonaws.com/cicd-pipeline3-image" > imagedefinitions.json


artifacts:
  files:
    - imagedefinitions.json
